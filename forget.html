<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | IDT Academy</title>
<link rel="icon" href="https://i.imgur.com/P8QmPgkE.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --violet:#7c3aed;
  --violet-d:#6d28d9;
  --violet-l:#a78bfa;
  --cyan:#06b6d4;
  --amber:#f59e0b;
  --rose:#f43f5e;
  --green:#10b981;
  --ink:#1e1b4b;
  --muted:#6d6a8a;
  --line:rgba(124,58,237,.15);
  --shadow:0 24px 60px rgba(80,40,160,.16);
}
html{scroll-behavior:smooth}
body{
  font-family:'Poppins',system-ui,-apple-system,sans-serif;
  color:var(--ink);
  min-height:100vh;
  background:
    radial-gradient(820px 480px at 6% -6%, rgba(167,139,250,.30), transparent 60%),
    radial-gradient(740px 480px at 98% 4%, rgba(34,211,238,.22), transparent 58%),
    radial-gradient(820px 540px at 50% 112%, rgba(251,191,36,.16), transparent 60%),
    linear-gradient(160deg,#f8f6ff 0%,#ffffff 50%,#eefbff 100%);
  background-attachment:fixed;
  overflow-x:hidden;
  position:relative;
}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:url('https://i.imgur.com/CQgjfNJ.png') center/cover no-repeat fixed;opacity:.08;pointer-events:none}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:url('https://i.imgur.com/oyqM5oF.png') center/contain no-repeat fixed;opacity:.05;pointer-events:none}
::selection{background:rgba(124,58,237,.22)}
img{max-width:100%;display:block}
a{text-decoration:none;color:inherit}
button{font-family:inherit}
input,select,textarea{font-family:inherit}
textarea{resize:vertical}
.hidden{display:none !important}
.bg-blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.35;z-index:-1;pointer-events:none;animation:blobFloat 14s ease-in-out infinite}
.b1{width:420px;height:420px;left:-140px;top:-120px;background:rgba(124,58,237,.4)}
.b2{width:380px;height:380px;right:-120px;top:30%;background:rgba(6,182,212,.32);animation-delay:3s}
.b3{width:360px;height:360px;left:30%;bottom:-160px;background:rgba(245,158,11,.26);animation-delay:6s}
@keyframes blobFloat{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,-40px) scale(1.15)}}
.topbar{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:14px 4%;
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(124,58,237,.12);
}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer}
.brand img{width:50px;height:50px;object-fit:contain;background:#fff;border-radius:50%;padding:6px;box-shadow:0 8px 22px rgba(124,58,237,.25)}
.brand h1{font-size:18px;font-weight:900;line-height:1.1}
.brand p{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:1.4px;text-transform:uppercase}
.top-right{display:flex;align-items:center;gap:10px}
.btn-home{
  display:inline-flex;align-items:center;gap:8px;border:none;cursor:pointer;
  font-weight:700;font-size:13.5px;padding:11px 18px;border-radius:12px;color:#fff;
  background:linear-gradient(135deg,#f59e0b,#f97316);
  box-shadow:0 10px 24px rgba(245,158,11,.32);
  transition:transform .2s ease,box-shadow .2s ease;
}
.btn-home:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(245,158,11,.42)}
.menu-btn{
  width:46px;height:46px;border-radius:13px;border:1.5px solid var(--line);
  background:#fff;color:var(--violet-d);font-size:17px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .22s ease;
}
.menu-btn:hover{background:var(--violet);color:#fff;border-color:var(--violet)}
.side-menu{
  position:fixed;top:0;right:0;bottom:0;z-index:5000;
  width:min(340px,88vw);
  background:#fff;
  box-shadow:-24px 0 60px rgba(15,12,41,.25);
  transform:translateX(105%);
  transition:transform .35s cubic-bezier(.22,.9,.35,1);
  display:flex;flex-direction:column;
  border-radius:22px 0 0 22px;
}
.side-menu.open{transform:translateX(0)}
.sm-head{
  display:flex;align-items:center;gap:12px;padding:18px 18px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(135deg,rgba(124,58,237,.07),rgba(6,182,212,.07));
  border-radius:22px 0 0 0;
}
.sm-head img{width:46px;height:46px;border-radius:50%;background:#fff;padding:6px;box-shadow:0 8px 20px rgba(124,58,237,.25)}
.sm-head div{flex:1;min-width:0}
.sm-head b{font-size:14.5px;font-weight:900;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sm-head small{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sm-head small i{color:var(--amber)}
.sm-close{
  border:none;background:rgba(244,63,94,.1);color:var(--rose);
  width:38px;height:38px;border-radius:12px;cursor:pointer;font-size:14px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s ease;
}
.sm-close:hover{background:var(--rose);color:#fff;transform:rotate(90deg)}
.sm-body{flex:1;overflow-y:auto;padding:12px}
.sm-item{
  width:100%;display:flex;align-items:center;gap:13px;
  padding:13px 14px;border-radius:13px;border:none;background:transparent;
  cursor:pointer;font-size:13.5px;font-weight:600;color:#3d3a6b;
  text-align:left;transition:all .2s ease;margin-bottom:4px;
}
.sm-item i{width:22px;text-align:center;color:var(--violet);font-size:15px;flex-shrink:0}
.sm-item:hover{background:rgba(124,58,237,.08);color:var(--violet);transform:translateX(3px)}
.sm-item .sm-extra{margin-left:auto;font-size:11px;font-weight:800;color:var(--amber);background:rgba(245,158,11,.12);padding:4px 10px;border-radius:999px}
.sm-item .sm-extra.green{color:#047857;background:rgba(16,185,129,.14)}
.sm-item.sm-danger{color:var(--rose)}
.sm-item.sm-danger i{color:var(--rose)}
.sm-item.sm-danger:hover{background:rgba(244,63,94,.08)}
.sm-foot{padding:14px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);text-align:center}
.ov-backdrop{
  position:fixed;inset:0;z-index:4000;
  background:rgba(15,12,41,.62);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;visibility:hidden;transition:all .3s ease;
}
.ov-backdrop.active{opacity:1;visibility:visible}
.forget-hero{
  min-height:calc(100vh - 80px);
  display:flex;align-items:center;justify-content:center;
  padding:40px 20px 60px;
}
.forget-wrap{
  width:100%;max-width:560px;
  background:rgba(255,255,255,.78);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-radius:28px;
  border:1px solid rgba(124,58,237,.10);
  box-shadow:var(--shadow);
  padding:44px 40px 40px;
  opacity:0;transform:translateY(22px);
  transition:all .6s cubic-bezier(.22,.9,.35,1);
}
.forget-wrap.ready{opacity:1;transform:translateY(0)}
.forget-head{text-align:center;margin-bottom:32px}
.forget-head .fi{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,rgba(124,58,237,.12),rgba(6,182,212,.12));display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:26px;color:var(--violet)}
.forget-head h2{font-size:24px;font-weight:900;color:var(--ink);margin-bottom:6px}
.forget-head p{font-size:14px;color:var(--muted);line-height:1.6}
.forget-form-section{transition:all .5s ease}
.forget-group{margin-bottom:20px}
.forget-group label{display:block;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:7px;letter-spacing:.3px}
.forget-group label i{color:var(--violet);margin-right:6px}
.forget-group .input-wrap{
  display:flex;align-items:center;
  background:#fff;border:2px solid var(--line);
  border-radius:14px;padding:0 16px;
  transition:all .25s ease;
}
.forget-group .input-wrap:focus-within{border-color:var(--violet);box-shadow:0 0 0 4px rgba(124,58,237,.10)}
.forget-group .input-wrap i{color:var(--muted);font-size:14px;transition:color .25s ease}
.forget-group .input-wrap:focus-within i{color:var(--violet)}
.forget-group .input-wrap input{
  flex:1;border:none;background:transparent;
  padding:14px 12px;font-size:14px;font-weight:500;
  color:var(--ink);outline:none;
}
.forget-group .input-wrap input::placeholder{color:#b0adc8;font-weight:400}
.forget-btn-wrap{margin-top:28px}
.forget-btn{
  width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
  border:none;cursor:pointer;padding:16px 20px;border-radius:14px;
  font-size:15px;font-weight:800;letter-spacing:.5px;color:#fff;
  background:linear-gradient(135deg,var(--violet),var(--violet-d));
  box-shadow:0 12px 28px rgba(124,58,237,.30);
  transition:all .25s ease;
}
.forget-btn:hover{transform:translateY(-2px);box-shadow:0 16px 36px rgba(124,58,237,.40)}
.forget-btn:active{transform:translateY(0);box-shadow:0 8px 20px rgba(124,58,237,.25)}
.forget-btn i{font-size:14px;transition:transform .25s ease}
.forget-btn:hover i{transform:translateX(4px)}
.forget-back{
  display:block;text-align:center;margin-top:18px;
  font-size:13px;font-weight:600;color:var(--muted);
  transition:color .2s ease;
}
.forget-back i{margin-right:6px}
.forget-back:hover{color:var(--violet)}
.forget-success{
  display:none;flex-direction:column;align-items:center;text-align:center;
  padding:16px 0;animation:fadeUp .5s ease;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.forget-success .suc-icon{
  width:72px;height:72px;border-radius:50%;
  background:linear-gradient(135deg,rgba(16,185,129,.14),rgba(6,182,212,.14));
  display:flex;align-items:center;justify-content:center;
  margin-bottom:18px;font-size:30px;color:var(--green);cursor:pointer;
  transition:all .25s ease;
}
.forget-success .suc-icon:hover{transform:scale(1.08);box-shadow:0 8px 24px rgba(16,185,129,.22)}
.forget-success h3{font-size:21px;font-weight:900;color:var(--ink);margin-bottom:8px}
.forget-success p{font-size:14px;color:var(--muted);line-height:1.7;max-width:380px}
.forget-success p b{color:var(--violet);font-weight:700}
.forget-success .suc-email{display:inline-block;margin-top:10px;padding:10px 18px;background:rgba(124,58,237,.07);border-radius:10px;font-size:13px;font-weight:700;color:var(--violet-d)}
.forget-success .suc-btn{
  display:inline-flex;align-items:center;gap:8px;margin-top:18px;
  border:none;cursor:pointer;padding:13px 26px;border-radius:12px;
  font-size:14px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,#f59e0b,#f97316);
  box-shadow:0 10px 24px rgba(245,158,11,.30);
  transition:all .25s ease;
}
.forget-success .suc-btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(245,158,11,.42)}
.forget-inner-loader{
  display:flex;align-items:center;justify-content:center;gap:12px;
  padding:16px 20px;border-radius:14px;
  background:linear-gradient(135deg,var(--violet),var(--violet-d));
  box-shadow:0 12px 28px rgba(124,58,237,.30);
  color:#fff;
}


html {
    opacity: 0;
    transition: opacity 0.3s ease-in-out;
  }
 
  html.ready {
    opacity: 1;
  }
  
.forget-spinner{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spinnerRotate .6s linear infinite}
@keyframes spinnerRotate{to{transform:rotate(360deg)}}
.forget-spinner-text{font-size:13px;font-weight:700;letter-spacing:.3px}
.idt-toast{
  position:fixed;top:30px;right:30px;z-index:9999;
  display:flex;align-items:center;gap:12px;
  padding:16px 24px;border-radius:16px;background:#fff;
  box-shadow:0 20px 48px rgba(15,12,41,.22);
  border:1px solid var(--line);
  max-width:400px;
  opacity:0;visibility:hidden;transform:translateX(40px);
  transition:all .4s cubic-bezier(.22,.9,.35,1);
}
.idt-toast.active{opacity:1;visibility:visible;transform:translateX(0)}
.idt-toast-icon{font-size:18px}
.idt-toast-icon.success{color:var(--green)}
.idt-toast-icon.error{color:var(--rose)}
.idt-toast-msg{font-size:13px;font-weight:600;color:var(--ink);flex:1}
@media(max-width:580px){
  .forget-wrap{padding:30px 22px 28px;border-radius:20px}
  .forget-head h2{font-size:20px}
  .topbar{padding:12px 4%}
  .brand h1{font-size:15px}
  .brand img{width:40px;height:40px}
  .btn-home{padding:9px 14px;font-size:12px}
  .menu-btn{width:40px;height:40px;font-size:15px}
  .forget-success .suc-icon{width:60px;height:60px;font-size:24px}
}
.idt-hide{opacity:0;visibility:hidden;pointer-events:none}



</style>
</head>
<body>

<div class="bg-blob b1"></div>
<div class="bg-blob b2"></div>
<div class="bg-blob b3"></div>

<header class="topbar">
  <div class="brand" onclick="window.location.href='/'">
    <img src="https://i.imgur.com/vLaejQ7.png" alt="IDT Academy">
    <div>
      <h1>IDT Academy</h1>
      <p>Learn Beyond Limits</p>
    </div>
  </div>
  <div class="top-right">
    <button class="btn-home" onclick="window.location.href='/'"><i class="fa-solid fa-house"></i> Home</button>
    <button class="menu-btn" id="menuToggle" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
  </div>
</header>

<div class="side-menu" id="sideMenu">
  <div class="sm-head">
    <img src="https://i.imgur.com/P8QmPgkE.png" alt="IDT Academy">
    <div>
      <b>IDT Academy</b>
      <small><i class="fa-solid fa-graduation-cap"></i> eLearning Portal</small>
    </div>
    <button class="sm-close" id="menuClose" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div class="sm-body">
    <button class="sm-item" onclick="window.location.href='/'"><i class="fa-solid fa-house"></i> Home</button>
    <button class="sm-item" onclick="window.location.href='/courses'"><i class="fa-solid fa-book-open"></i> Courses <span class="sm-extra green">12</span></button>
    <button class="sm-item" onclick="window.location.href='/dashboard'"><i class="fa-solid fa-gauge-high"></i> Dashboard</button>
    <button class="sm-item" onclick="window.location.href='/profile'"><i class="fa-solid fa-user"></i> Profile</button>
    <button class="sm-item sm-danger" onclick="window.location.href='/login'"><i class="fa-solid fa-right-from-bracket"></i> Login</button>
  </div>
  <div class="sm-foot">IDT Academy &copy; 2026</div>
</div>

<div class="ov-backdrop" id="ovBackdrop"></div>

<section class="forget-hero">
  <div class="forget-wrap" id="forgetWrap">
    <div class="forget-head">
      <div class="fi"><i class="fa-solid fa-key"></i></div>
      <h2>Forgot Password</h2>
      <p>Enter your registered email address and we'll send you a new password.</p>
    </div>
    <div class="forget-form-section" id="forgetFormSection">
      <div class="forget-group">
        <label><i class="fa-solid fa-envelope"></i> Email Address</label>
        <div class="input-wrap">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="forgetEmail" placeholder="you@example.com" autocomplete="email" inputmode="email">
        </div>
      </div>
      <div class="forget-btn-wrap" id="forgetBtnWrap">
        <button class="forget-btn" id="forgetBtn"><span>Recover Password</span><i class="fa-solid fa-arrow-right"></i></button>
      </div>
      <a class="forget-back" href="/login"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
    </div>
    <div class="forget-success" id="forgetSuccess">
      <div class="suc-icon" id="forgetSuccessIcon"><i class="fa-solid fa-circle-check"></i></div>
      <h3>Password Sent!</h3>
      <p>We've sent a new password to <b id="forgetSuccessEmail"></b></p>
      <div class="suc-email"><i class="fa-regular fa-envelope"></i> <span id="forgetSuccessEmailDisplay"></span></div>
      <button class="suc-btn" id="forgetOpenGmail"><i class="fa-brands fa-google"></i> Open Gmail</button>
    </div>
  </div>
</section>

<div class="idt-toast" id="forgetToast">
  <i class="fa-solid" id="forgetToastIcon"></i>
  <span class="idt-toast-msg" id="forgetToastMsg"></span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bcryptjs/2.4.3/bcrypt.min.js"></script>
<script type="module" src="forget.js"></script>

</body>
</html>
