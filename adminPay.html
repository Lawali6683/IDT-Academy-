<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7c3aed">
<meta name="description" content="Admin Payment Management - IDT Academy">
<title>Admin Payments - IDT Academy</title>
<link rel="icon" href="https://i.imgur.com/oyqM5oF.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --violet:#7c3aed;
  --violet-d:#6d28d9;
  --violet-l:#a78bfa;
  --cyan:#06b6d4;
  --amber:#f59e0b;
  --rose:#f43f5e;
  --green:#10b981;
  --ink:#1e1b4b;
  --muted:#6d6a8a;
  --line:rgba(124,58,237,.15);
  --shadow:0 24px 60px rgba(80,40,160,.16);
}
html{scroll-behavior:smooth}
body{
  font-family:'Poppins',system-ui,-apple-system,sans-serif;
  color:var(--ink);
  min-height:100vh;
  background:
    radial-gradient(820px 480px at 6% -6%, rgba(167,139,250,.30), transparent 60%),
    radial-gradient(740px 480px at 98% 4%, rgba(34,211,238,.22), transparent 58%),
    radial-gradient(820px 540px at 50% 112%, rgba(251,191,36,.16), transparent 60%),
    linear-gradient(160deg,#f8f6ff 0%,#ffffff 50%,#eefbff 100%);
  background-attachment:fixed;
  overflow-x:hidden;
  position:relative;
}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:url('https://i.imgur.com/CQgjfNJ.png') center/cover no-repeat fixed;opacity:.08;pointer-events:none}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:url('https://i.imgur.com/oyqM5oF.png') center/contain no-repeat fixed;opacity:.05;pointer-events:none}
::selection{background:rgba(124,58,237,.22)}
img{max-width:100%;display:block}
a{text-decoration:none;color:inherit}
button{font-family:inherit}
input,select,textarea{font-family:inherit}
textarea{resize:vertical}
.hidden{display:none !important}
.bg-blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.35;z-index:-1;pointer-events:none;animation:blobFloat 14s ease-in-out infinite}
.b1{width:420px;height:420px;left:-140px;top:-120px;background:rgba(124,58,237,.4)}
.b2{width:380px;height:380px;right:-120px;top:30%;background:rgba(6,182,212,.32);animation-delay:3s}
.b3{width:360px;height:360px;left:30%;bottom:-160px;background:rgba(245,158,11,.26);animation-delay:6s}
@keyframes blobFloat{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,-40px) scale(1.15)}}

.login-page{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:20px;position:relative;z-index:1;
}
.login-card{
  width:100%;max-width:420px;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,.7);
  border-radius:26px;padding:34px 28px;
  box-shadow:0 34px 80px rgba(80,40,160,.2);
  text-align:center;
}
.login-logo{
  width:72px;height:72px;object-fit:contain;background:#fff;
  border-radius:50%;padding:8px;margin:0 auto 10px;
  box-shadow:0 12px 28px rgba(124,58,237,.28);
}
.login-card h2{font-size:20px;font-weight:900;margin-bottom:4px}
.login-card p{font-size:12.5px;color:var(--muted);margin-bottom:22px}
.login-form{display:flex;flex-direction:column;gap:14px}
.login-form .fg{display:flex;flex-direction:column;gap:6px;text-align:left}
.login-form .fg label{font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px}
.login-form .fg label i{color:var(--violet)}
.login-form .fg input{
  width:100%;padding:14px 16px;border:1.5px solid var(--line);
  border-radius:13px;font-size:13px;color:var(--ink);
  background:#fff;outline:none;transition:all .2s ease;
}
.login-form .fg input:focus{border-color:var(--violet);box-shadow:0 0 0 4px rgba(124,58,237,.1)}
.pw-wrap{position:relative}
.pw-wrap input{width:100%;padding-right:44px}
.pw-toggle{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  border:none;background:transparent;color:var(--muted);
  cursor:pointer;font-size:16px;padding:4px;
}

.admin-wrap{display:none;max-width:960px;margin:0 auto;padding:28px 18px 40px;position:relative;z-index:1}

.admin-header{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  margin-bottom:20px;flex-wrap:wrap;
}
.admin-brand{display:flex;align-items:center;gap:12px}
.admin-brand img{width:46px;height:46px;border-radius:50%;background:#fff;padding:6px;box-shadow:0 8px 20px rgba(124,58,237,.25)}
.admin-brand h1{font-size:16px;font-weight:900;line-height:1.1}
.admin-brand p{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:1.2px;text-transform:uppercase}
.admin-logout{
  border:none;background:rgba(244,63,94,.1);color:var(--rose);
  padding:11px 18px;border-radius:12px;cursor:pointer;font-size:13px;font-weight:700;
  display:flex;align-items:center;gap:8px;transition:all .2s ease;
}
.admin-logout:hover{background:var(--rose);color:#fff}

.stats-row{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px;
}
.stat-card{
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.7);border-radius:18px;
  padding:16px 14px;box-shadow:var(--shadow);text-align:center;
}
.stat-card i{font-size:24px;margin-bottom:6px;display:block}
.stat-card .sc-num{font-size:28px;font-weight:900;color:var(--violet-d);display:block;line-height:1.2}
.stat-card .sc-label{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-top:4px}

.admin-tabs{
  display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none;
}
.admin-tabs::-webkit-scrollbar{display:none}
.atab{
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
  border:1.5px solid var(--line);background:#fff;border-radius:999px;
  padding:9px 16px;font-size:12.5px;font-weight:700;color:var(--ink);
  cursor:pointer;transition:all .22s ease;flex-shrink:0;
}
.atab i{color:var(--violet)}
.atab:hover{border-color:var(--violet-l)}
.atab.active{
  background:linear-gradient(135deg,var(--violet),var(--violet-d));
  color:#fff;border-color:transparent;
}
.atab.active i{color:#fff}
.atab .tab-count{
  font-size:10px;font-weight:900;padding:2px 8px;border-radius:999px;
  background:rgba(124,58,237,.12);color:var(--violet-d);
}
.atab.active .tab-count{background:rgba(255,255,255,.2);color:#fff}

.admin-card{
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.7);border-radius:20px;
  padding:18px;box-shadow:var(--shadow);margin-bottom:14px;
}
.ac-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  margin-bottom:12px;
}
.ac-user{flex:1;min-width:0}
.ac-user b{font-size:15px;font-weight:900;display:block}
.ac-user span{font-size:11.5px;color:var(--muted);display:block}
.ac-badge{
  font-size:10px;font-weight:800;padding:4px 11px;border-radius:999px;text-transform:uppercase;
  flex-shrink:0;
}
.ac-badge.overdue{
  background:rgba(244,63,94,.12);color:var(--rose);
}
.ac-badge.pending{
  background:rgba(245,158,11,.14);color:#b45309;
}
.ac-details{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.ac-row{
  display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink);
}
.ac-row i{color:var(--violet);width:18px;text-align:center;font-size:11px}
.ac-row .copy-mini{
  border:none;background:rgba(124,58,237,.08);color:var(--violet-d);
  width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:11px;flex-shrink:0;
  display:inline-flex;align-items:center;justify-content:center;transition:all .2s ease;
}
.ac-row .copy-mini:hover{background:var(--violet);color:#fff}
.ac-row .copy-mini.done{background:var(--green);color:#fff}
.ac-actions{display:flex;gap:8px}
.ac-actions .btn{font-size:12px;padding:10px 16px}

.empty-state{
  text-align:center;padding:40px 18px;
}
.empty-state i{font-size:44px;color:rgba(124,58,237,.18);display:block;margin-bottom:10px}
.empty-state b{font-size:15px;display:block;margin-bottom:5px}
.empty-state p{font-size:12.5px;color:var(--muted)}

.toast-wrap{
  position:fixed;top:20px;right:20px;z-index:100000;
  display:flex;flex-direction:column;gap:10px;max-width:min(92vw,400px);
}
.toast{
  display:flex;align-items:flex-start;gap:11px;
  background:rgba(255,255,255,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(124,58,237,.14);border-radius:15px;padding:14px 15px;
  box-shadow:0 16px 38px rgba(30,27,75,.18);font-size:13.5px;font-weight:500;color:var(--ink);
  animation:toastIn .35s ease both;
}
.toast.out{animation:toastOut .3s ease both}
@keyframes toastIn{from{opacity:0;transform:translateX(44px)}to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{to{opacity:0;transform:translateX(44px)}}
.toast > i{font-size:18px;margin-top:1px;flex-shrink:0}
.toast.success > i{color:var(--green)}
.toast.error > i{color:var(--rose)}
.toast.info > i{color:var(--violet)}
.toast-body{flex:1;min-width:0}
.toast-body b{display:block;font-size:13.5px;margin-bottom:2px}
.toast-body p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.5}
.toast-x{
  border:none;background:rgba(239,68,68,.1);color:var(--rose);
  width:28px;height:28px;border-radius:9px;cursor:pointer;font-size:12px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;transition:all .2s ease;
}
.toast-x:hover{background:var(--rose);color:#fff}

.modal-small{
  position:fixed;inset:0;z-index:6000;
  background:rgba(15,12,41,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;visibility:hidden;transition:all .25s ease;
}
.modal-small.open{opacity:1;visibility:visible}
.modal-small .ms-card{
  width:100%;max-width:380px;background:#fff;border-radius:22px;padding:24px;
  text-align:center;box-shadow:0 30px 70px rgba(15,12,41,.4);
  transform:scale(.94);transition:all .25s ease;
}
.modal-small.open .ms-card{transform:scale(1)}
.ms-card .ms-icon{width:60px;height:60px;margin:0 auto 13px;border-radius:18px;font-size:24px;display:flex;align-items:center;justify-content:center}
.ms-card .ms-icon.amber{background:rgba(245,158,11,.14);color:#b45309}
.ms-card .ms-icon.green{background:rgba(16,185,129,.14);color:#047857}
.ms-card .ms-icon.violet{background:rgba(124,58,237,.12);color:var(--violet-d)}
.ms-card h3{font-size:16px;font-weight:900;margin-bottom:6px}
.ms-card p{font-size:12.5px;color:var(--muted);line-height:1.6;margin-bottom:16px}
.ms-actions{display:flex;gap:9px}
.ms-actions .btn{padding:12px 14px;font-size:12.5px}

@media(max-width:640px){
  .login-card{padding:24px 18px}
  .login-card h2{font-size:17px}
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .admin-card{padding:14px}
  .ac-actions{flex-direction:column}
  .toast-wrap{left:12px;right:12px;max-width:none}
}



 html {
    opacity: 0;
    transition: opacity 0.3s ease-in-out;
  }
 
  html.ready {
    opacity: 1;
  }

</style>
</head>
<body>

<div class="bg-blob b1"></div>
<div class="bg-blob b2"></div>
<div class="bg-blob b3"></div>

<div class="login-page" id="loginSection">
  <div class="login-card">
    <img src="https://i.imgur.com/oyqM5oF.png" alt="IDT Academy" class="login-log">
    <h2>Admin Dashboard</h2>
    <p>Sign in to manage withdrawals and payments</p>
    <form class="login-form" id="adminLoginForm">
      <div class="fg">
        <label for="adminEmail"><i class="fa-solid fa-envelope"></i> Email</label>
        <input type="email" id="adminEmail" placeholder="admin@idtacademy.com.ng" required>
      </div>
      <div class="fg">
        <label for="adminPassword"><i class="fa-solid fa-lock"></i> Password</label>
        <div class="pw-wrap">
          <input type="password" id="adminPassword" placeholder="Enter your password" required>
          <button type="button" class="pw-toggle" id="pwToggle" aria-label="Toggle password visibility"><i class="fa-solid fa-eye"></i></button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" id="adminLoginBtn" style="width:100%;padding:16px;border:none;cursor:pointer;font-weight:800;font-size:14.5px;border-radius:14px;background:linear-gradient(135deg,var(--violet),var(--violet-d));color:#fff;box-shadow:0 14px 30px rgba(109,40,217,.35);display:flex;align-items:center;justify-content:center;gap:9px;transition:transform .22s ease,box-shadow .22s ease">
        <i class="fa-solid fa-right-to-bracket"></i> Sign In
      </button>
    </form>
    <div id="loginError" style="margin-top:12px;font-size:12px;color:var(--rose);display:none"></div>
  </div>
</div>

<main class="admin-wrap" id="adminSection">
  <div class="admin-header">
    <div class="admin-brand">
      <img src="https://i.imgur.com/oyqM5oF.png" alt="IDT Academy">
      <div>
        <h1>IDT Academy</h1>
        <p>Admin Payment Control</p>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <span style="font-size:12px;color:var(--muted);font-weight:700" id="adminEmailDisplay">admin@...</span>
      <button class="admin-logout" id="adminLogoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
    </div>
  </div>

  <div class="stats-row" id="statsRow">
    <div class="stat-card" style="border-left:4px solid var(--violet)">
      <i class="fa-solid fa-users" style="color:var(--violet)"></i>
      <span class="sc-num" id="statTotalUsers">0</span>
      <span class="sc-label">Total Users</span>
    </div>
    <div class="stat-card" style="border-left:4px solid var(--green)">
      <i class="fa-solid fa-book-open" style="color:var(--green)"></i>
      <span class="sc-num" id="statActiveUsers">0</span>
      <span class="sc-label">Active Students</span>
    </div>
    <div class="stat-card" style="border-left:4px solid var(--amber)">
      <i class="fa-solid fa-clock" style="color:var(--amber)"></i>
      <span class="sc-num" id="statPendingUsers">0</span>
      <span class="sc-label">Pending Registrations</span>
    </div>
    <div class="stat-card" style="border-left:4px solid var(--rose)">
      <i class="fa-solid fa-money-bill-wave" style="color:var(--rose)"></i>
      <span class="sc-num" id="statPendingWithdrawals">0</span>
      <span class="sc-label">Pending Withdrawals</span>
    </div>
  </div>

  <div class="admin-tabs" id="adminTabs">
    <button class="atab active" data-tab="pending" id="tabPending">
      <i class="fa-solid fa-clock"></i> Pending Withdrawals <span class="tab-count" id="pendingCount">0</span>
    </button>
    <button class="atab" data-tab="completed" id="tabCompleted">
      <i class="fa-solid fa-check-circle"></i> Completed Payments <span class="tab-count" id="completedCount">0</span>
    </button>
  </div>

  <div id="pendingTab">
    <div id="pendingList"></div>
  </div>
  <div id="completedTab" class="hidden">
    <div id="completedList"></div>
  </div>
</main>

<div class="modal-small" id="confirmModal">
  <div class="ms-card">
    <div class="ms-icon amber" id="confirmIcon"><i class="fa-solid fa-triangle-exclamation"></i></div>
    <h3 id="confirmTitle">Confirm Action</h3>
    <p id="confirmMsg">Are you sure you want to proceed?</p>
    <div class="ms-actions">
      <button class="btn btn-outline" id="confirmCancel" style="width:auto;flex:1">Cancel</button>
      <button class="btn btn-danger" id="confirmProceed" style="width:auto;flex:1">Proceed</button>
    </div>
  </div>
</div>

<div id="toastWrap" class="toast-wrap"></div>

<script type="module" src="adminPay.js"></script>
</body>
</html>
