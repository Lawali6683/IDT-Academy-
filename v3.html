<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Admin Dashboard - IDT Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--violet:#7c3aed;
--violet-d:#6d28d9;
--cyan:#06b6d4;
--amber:#f59e0b;
--rose:#f43f5e;
--green:#10b981;
--ink:#1e1b4b;
--muted:#6d6a8a;
--line:#e7e3f7;
--bg:#f6f4ff;
--card:#ffffff;
}
body{
font-family:'Poppins',system-ui,-apple-system,sans-serif;
color:var(--ink);
min-height:100vh;
background:var(--bg);
overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer;border:none}
input{font-family:inherit;outline:none}
.hidden{display:none!important}
.page-gate{
position:fixed;inset:0;z-index:9999;
display:flex;align-items:center;justify-content:center;
background:var(--bg);
transition:opacity .3s ease,visibility .3s ease;
}
.page-gate.hidden{display:flex!important;opacity:0;visibility:hidden;pointer-events:none}
.gate-card{
background:var(--card);
border:1px solid var(--line);
border-radius:22px;
padding:32px 24px;
width:100%;max-width:420px;margin:20px;
text-align:center;
box-shadow:0 12px 32px rgba(80,40,160,.12);
border-top:5px solid var(--violet);
}
.gate-card .logo{width:70%;max-width:240px;object-fit:contain;margin:0 auto 14px;display:block}
.gate-card h2{font-size:20px;font-weight:800;margin-bottom:4px}
.gate-card p{font-size:12.5px;color:var(--muted);margin-bottom:22px}
.code-boxes{display:flex;gap:10px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
.code-boxes input{
width:50px;height:58px;
background:#fff;border:2px solid var(--line);
border-radius:12px;text-align:center;
font-size:22px;font-weight:700;color:var(--ink);
transition:border-color .15s ease;
caret-color:var(--violet);
}
.code-boxes input:focus{border-color:var(--violet)}
.code-boxes input.filled{border-color:var(--violet);background:#faf8ff}
.gate-card .gate-error{font-size:12.5px;color:var(--rose);margin:6px 0 0;display:none}
.page-dash{display:none}
.page-dash.active{display:block;padding:24px 16px 40px;max-width:1100px;margin:0 auto}
.dash-header{
display:flex;align-items:center;justify-content:space-between;
background:var(--card);
border:1px solid var(--line);
border-top:4px solid var(--violet);
border-radius:18px;
padding:16px;margin-bottom:22px;
gap:14px;flex-wrap:wrap;
}
.dash-header-left{display:flex;align-items:center;gap:14px}
.dash-header-left .logo-sm{width:120px;max-width:40vw;object-fit:contain}
.dash-header-left h1{font-size:16px;font-weight:800}
.dash-header-left h1 .accent{color:var(--violet)}
.dash-header-left h1 .role{font-size:13px;font-weight:400;color:var(--muted)}
.dash-header-left .sub{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
.lock-btn{
background:#fff1f3;color:var(--rose);
padding:10px 18px;border-radius:12px;font-size:13px;font-weight:700;
display:flex;align-items:center;gap:8px;
transition:background .15s ease,color .15s ease;
}
.lock-btn:hover{background:var(--rose);color:#fff}
.section-title{
font-size:16px;font-weight:800;margin-bottom:16px;
display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.section-title i{color:var(--violet)}
.section-title .hint{font-size:12px;font-weight:400;color:var(--muted)}
.count-pill{
display:inline-flex;align-items:center;justify-content:center;
min-width:28px;height:28px;padding:0 10px;
border-radius:20px;font-size:12px;font-weight:700;
background:var(--violet);color:#fff;
}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.menu-btn{
display:flex;flex-direction:column;text-align:left;width:100%;
background:var(--card);
border:1px solid var(--line);
border-radius:18px;
padding:18px;
color:var(--ink);
transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease;
}
.menu-btn:hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 10px 22px rgba(80,40,160,.12)}
.menu-btn:active{transform:scale(.98)}
.menu-btn:focus-visible,.ally-btn:focus-visible,.lock-btn:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
.menu-btn.violet{--c:#7c3aed;--t:#f3edff}
.menu-btn.cyan{--c:#06b6d4;--t:#e6f9fc}
.menu-btn.amber{--c:#f59e0b;--t:#fff5e0}
.menu-btn.green{--c:#10b981;--t:#e5f8f1}
.menu-btn.rose{--c:#f43f5e;--t:#ffe9ed}
.mc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;width:100%}
.mc-icon{
width:50px;height:50px;border-radius:14px;
display:flex;align-items:center;justify-content:center;
font-size:21px;background:var(--t);color:var(--c);
}
.mc-badge{
display:inline-flex;align-items:center;gap:5px;
padding:4px 11px;border-radius:20px;
font-size:10px;font-weight:700;
}
.mc-badge.ceo{background:#fff5e0;color:#b97800}
.mc-badge.staff{background:#f3edff;color:var(--violet-d)}
.mc-badge.admin{background:#e6f9fc;color:#0a8aa0}
.mc-title{font-size:14.5px;font-weight:700;margin-bottom:4px}
.mc-desc{font-size:12px;color:var(--muted);line-height:1.55;margin-bottom:14px;flex:1}
.mc-footer{
display:flex;align-items:center;justify-content:space-between;
border-top:1px solid var(--line);
padding-top:11px;margin-top:auto;width:100%;
}
.mc-open{font-size:12px;font-weight:600;color:var(--c)}
.mc-arrow{
width:30px;height:30px;border-radius:10px;
display:flex;align-items:center;justify-content:center;
background:var(--t);color:var(--c);font-size:12px;
transition:background .15s ease,color .15s ease;
}
.menu-btn:hover .mc-arrow{background:var(--c);color:#fff}
.ally-section{margin-top:28px;display:flex;justify-content:center}
.ally-btn{
display:inline-flex;align-items:center;gap:12px;
background:var(--ink);color:#fff;
border-radius:18px;padding:13px 24px;
transition:transform .15s ease,background .15s ease;
}
.ally-btn:hover{background:var(--violet-d);transform:translateY(-2px)}
.ally-btn:active{transform:scale(.97)}
.ally-icon{
width:40px;height:40px;border-radius:12px;
background:rgba(255,255,255,.16);
display:flex;align-items:center;justify-content:center;font-size:16px;
}
.ally-text{text-align:left}
.ally-text b{display:block;font-size:14px;font-weight:700}
.ally-text span{display:block;font-size:11px;opacity:.78;margin-top:1px}
.ally-arrow{font-size:13px}
.toast-container{
position:fixed;top:16px;right:16px;z-index:100000;
display:flex;flex-direction:column;gap:10px;
max-width:min(92vw,400px);pointer-events:none;
}
.toast{
display:flex;align-items:flex-start;gap:11px;
background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;
box-shadow:0 10px 26px rgba(30,27,75,.16);
font-size:13px;color:var(--ink);
animation:toastIn .25s ease both;
pointer-events:auto;
}
.toast.out{animation:toastOut .2s ease both}
@keyframes toastIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{to{opacity:0;transform:translateX(30px)}}
.toast>i{font-size:18px;margin-top:2px;flex-shrink:0}
.toast.success>i{color:var(--green)}
.toast.error>i{color:var(--rose)}
.toast.info>i{color:var(--violet)}
.toast.warning>i{color:var(--amber)}
.toast-body{flex:1;min-width:0}
.toast-body b{display:block;font-size:13.5px;margin-bottom:2px}
.toast-body p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.5}
.toast-close{
background:#fff1f3;color:var(--rose);
width:28px;height:28px;border-radius:9px;font-size:12px;flex-shrink:0;
display:flex;align-items:center;justify-content:center;
}
.toast-container:empty{display:none}
@media(max-width:600px){
.gate-card{padding:26px 18px}
.code-boxes input{width:44px;height:52px;font-size:20px}
.dash-header{flex-direction:column;align-items:flex-start}
.menu-grid{grid-template-columns:1fr}
.toast-container{top:10px;right:10px;max-width:calc(100vw - 20px)}
.ally-btn{padding:12px 18px}
}
@media(min-width:601px) and (max-width:900px){
.menu-grid{grid-template-columns:repeat(2,1fr)}
}
@media(prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
@media print{
.page-gate,.lock-btn,.toast-container,.ally-section{display:none!important}
.page-dash.active{padding:0}
body{background:#fff!important;color:#000!important}
.menu-btn{break-inside:avoid;box-shadow:none!important}
}
</style>
</head>
<body>
<div class="page-gate" id="pageGate">
<div class="gate-card">
<img src="https://i.imgur.com/oyqM5oF.png" alt="IDT Academy" class="logo">
<h2>Admin Access</h2>
<p>Enter the security code to access the dashboard</p>
<div class="code-boxes" id="codeBoxes">
<input type="text" maxlength="1" class="code-input" data-index="0" inputmode="numeric" pattern="[0-9]" autocomplete="off">
<input type="text" maxlength="1" class="code-input" data-index="1" inputmode="numeric" pattern="[0-9]" autocomplete="off">
<input type="text" maxlength="1" class="code-input" data-index="2" inputmode="numeric" pattern="[0-9]" autocomplete="off">
<input type="text" maxlength="1" class="code-input" data-index="3" inputmode="numeric" pattern="[0-9]" autocomplete="off">
<input type="text" maxlength="1" class="code-input" data-index="4" inputmode="numeric" pattern="[0-9]" autocomplete="off">
<input type="text" maxlength="1" class="code-input" data-index="5" inputmode="numeric" pattern="[0-9]" autocomplete="off">
</div>
<p class="gate-error" id="gateError">Incorrect code. Access denied.</p>
</div>
</div>
<div class="page-dash" id="pageDash">
<div class="dash-header">
<div class="dash-header-left">
<img src="https://i.imgur.com/oyqM5oF.png" alt="IDT Academy" class="logo-sm">
<div>
<h1>IDT <span class="accent">Academy</span> <span class="role">| Admin</span></h1>
<div class="sub">Management Dashboard</div>
</div>
</div>
<button class="lock-btn" id="lockBtn" type="button"><i class="fa-solid fa-lock"></i> Lock</button>
</div>
<div class="section-title">
<i class="fa-solid fa-gauge-high"></i> Admin Menu
<span class="hint">| Select a section to manage</span>
<span class="count-pill" id="menuCount">0</span>
</div>
<div class="menu-grid" id="menuGrid"></div>
<div class="ally-section">
<button class="ally-btn" id="ceoAllyBtn" type="button">
<span class="ally-icon"><i class="fa-solid fa-user-shield"></i></span>
<span class="ally-text">
<b>CEO Ally</b>
<span>View, edit &amp; clean all user data in Supabase</span>
</span>
<span class="ally-arrow"><i class="fa-solid fa-arrow-right"></i></span>
</button>
</div>
</div>
<div class="toast-container" id="toastContainer"></div>
<script>
(function(){
var _c='MDYzODY2';
function _v(s){
return atob(s).split('').reverse().join('');
}
var correctCode=_v(_c);
var inputs=document.querySelectorAll('.code-input');
var gate=document.getElementById('pageGate');
var dash=document.getElementById('pageDash');
var gateErr=document.getElementById('gateError');
var menuGrid=document.getElementById('menuGrid');
var toastC=document.getElementById('toastContainer');
var lockBtn=document.getElementById('lockBtn');
var ceoAllyBtn=document.getElementById('ceoAllyBtn');

function showToast(type,title,msg){
var icons={success:'fa-circle-check',error:'fa-circle-xmark',info:'fa-circle-info',warning:'fa-triangle-exclamation'};
var t=document.createElement('div');
t.className='toast '+type;
t.innerHTML='<i class="fa-solid '+(icons[type]||icons.info)+'"></i><div class="toast-body"><b>'+title+'</b><p>'+msg+'</p></div><button class="toast-close" type="button"><i class="fa-solid fa-xmark"></i></button>';
t.querySelector('.toast-close').onclick=function(){
t.classList.add('out');
setTimeout(function(){t.remove()},200);
};
toastC.appendChild(t);
setTimeout(function(){
if(t.parentNode){
t.classList.add('out');
setTimeout(function(){t.remove()},200);
}
},4000);
}

var menus=[
{page:'post.html',icon:'fa-bullhorn',color:'violet',title:'Course Posts',desc:'Short course announcements visible to all students and teachers.',badge:'Staff',badgeClass:'staff',badgeIcon:'fa-user-pen'},
{page:'postcourse.html',icon:'fa-chalkboard-user',color:'cyan',title:'Topic Posts',desc:'Post and manage course topics for teachers and instructors.',badge:'Staff',badgeClass:'staff',badgeIcon:'fa-user-pen'},
{page:'videoadmin.html',icon:'fa-circle-play',color:'rose',title:'Video Admin',desc:'Add and manage videos shown in the course view.',badge:'Staff',badgeClass:'staff',badgeIcon:'fa-user-pen'},
{page:'adminChek.html',icon:'fa-headset',color:'green',title:'Customer Care',desc:'Handle student complaints, issues, and provide support resolutions.',badge:'Admin',badgeClass:'admin',badgeIcon:'fa-user-shield'},
{page:'adminCert.html',icon:'fa-certificate',color:'amber',title:'Certificates',desc:'Manage graduate certificates and issue official completion documents.',badge:'CEO',badgeClass:'ceo',badgeIcon:'fa-crown'},
{page:'adminPay.html',icon:'fa-coins',color:'green',title:'Payments',desc:'Manage referral bonuses, withdrawals, and payment approvals.',badge:'CEO',badgeClass:'ceo',badgeIcon:'fa-crown'},
{page:'analysis.html',icon:'fa-chart-line',color:'violet',title:'Analysis',desc:'View company growth metrics, revenue data, and performance reports.',badge:'CEO',badgeClass:'ceo',badgeIcon:'fa-crown'},
{page:'changeCourse.html',icon:'fa-pen-to-square',color:'cyan',title:'Course Editor',desc:'Search, edit, and update all course information and content.',badge:'CEO',badgeClass:'ceo',badgeIcon:'fa-crown'},
{page:'getPost.html',icon:'fa-share-nodes',color:'rose',title:'Post Verification',desc:'Verify social media posts and approve referral bonuses.',badge:'CEO',badgeClass:'ceo',badgeIcon:'fa-crown'},
{page:'jambTopic.html',icon:'fa-file-circle-question',color:'rose',title:'JAMB Topics',desc:'Post and manage JAMB test topics, questions, and practice sets.',badge:'CEO',badgeClass:'ceo',badgeIcon:'fa-crown'},
{page:'ceoCheck.html',icon:'fa-user-gear',color:'amber',title:'CEO Control',desc:'Edit student data, lock/unlock accounts, and resolve user issues.',badge:'CEO',badgeClass:'ceo',badgeIcon:'fa-crown'}
];

function buildMenu(){
var h='';
for(var i=0;i<menus.length;i++){
var m=menus[i];
h+='<button type="button" class="menu-btn '+m.color+'" data-page="'+m.page+'" data-name="'+m.title+'">'+
'<span class="mc-top">'+
'<span class="mc-icon"><i class="fa-solid '+m.icon+'"></i></span>'+
'<span class="mc-badge '+m.badgeClass+'"><i class="fa-solid '+m.badgeIcon+'"></i> '+m.badge+'</span>'+
'</span>'+
'<span class="mc-title">'+m.title+'</span>'+
'<span class="mc-desc">'+m.desc+'</span>'+
'<span class="mc-footer">'+
'<span class="mc-open">Open</span>'+
'<span class="mc-arrow"><i class="fa-solid fa-arrow-right"></i></span>'+
'</span>'+
'</button>';
}
menuGrid.innerHTML=h;
document.getElementById('menuCount').textContent=menus.length;
var btns=menuGrid.querySelectorAll('.menu-btn');
for(var j=0;j<btns.length;j++){
btns[j].onclick=function(){
var page=this.getAttribute('data-page');
showToast('info','Opening',this.getAttribute('data-name')+' ...');
setTimeout(function(){window.location.href=page},200);
};
}
}

function checkCode(){
var val='';
for(var i=0;i<inputs.length;i++){
val+=inputs[i].value;
}
if(val.length===6){
if(val===correctCode){
gate.classList.add('hidden');
dash.classList.add('active');
buildMenu();
showToast('success','Access Granted','Welcome to the Admin Dashboard.');
gateErr.style.display='none';
}else{
gateErr.style.display='block';
showToast('error','Access Denied','The code you entered is incorrect.');
for(var j=0;j<inputs.length;j++){
inputs[j].value='';
inputs[j].classList.remove('filled');
}
inputs[0].focus();
}
}
}

for(var k=0;k<inputs.length;k++){
inputs[k].oninput=function(){
var idx=parseInt(this.getAttribute('data-index'));
this.value=this.value.replace(/[^0-9]/g,'');
if(this.value.length>0){
this.classList.add('filled');
if(idx<5){
inputs[idx+1].focus();
}else{
inputs[idx].blur();
checkCode();
}
}else{
this.classList.remove('filled');
}
};
inputs[k].onkeydown=function(e){
var idx=parseInt(this.getAttribute('data-index'));
if(e.key==='Backspace'&&this.value.length===0&&idx>0){
inputs[idx-1].value='';
inputs[idx-1].classList.remove('filled');
inputs[idx-1].focus();
e.preventDefault();
}
if(e.key==='Enter'){checkCode()}
};
inputs[k].onfocus=function(){this.select()};
inputs[k].onpaste=function(e){
e.preventDefault();
var paste=(e.clipboardData||window.clipboardData).getData('text').replace(/[^0-9]/g,'').substring(0,6);
if(paste.length===6){
for(var p=0;p<6;p++){
inputs[p].value=paste[p];
inputs[p].classList.add('filled');
}
checkCode();
}
};
}

lockBtn.onclick=function(){
dash.classList.remove('active');
gate.classList.remove('hidden');
sessionStorage.removeItem('_adt');
for(var i=0;i<inputs.length;i++){
inputs[i].value='';
inputs[i].classList.remove('filled');
}
inputs[0].focus();
gateErr.style.display='none';
showToast('info','Locked','Dashboard has been locked.');
};

ceoAllyBtn.onclick=function(){
showToast('info','Opening','CEO Ally ...');
setTimeout(function(){window.location.href='ceoGet.html'},200);
};

inputs[0].focus();

var saved=sessionStorage.getItem('_adt');
if(saved==='1'){
gate.classList.add('hidden');
dash.classList.add('active');
buildMenu();
}

window.addEventListener('beforeunload',function(){
if(dash.classList.contains('active')){
sessionStorage.setItem('_adt','1');
}
});
})();
</script>
</body>
</html>
