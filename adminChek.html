<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Check - IDT Academy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --violet: #7c3aed;
            --violet-d: #6d28d9;
            --violet-l: #a78bfa;
            --cyan: #06b6d4;
            --amber: #f59e0b;
            --rose: #f43f5e;
            --green: #10b981;
            --ink: #1e1b4b;
            --muted: #6d6a8a;
            --line: rgba(124,58,237,.15);
            --shadow: 0 24px 60px rgba(80,40,160,.16);
        }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Poppins', system-ui, -apple-system, sans-serif;
            color: var(--ink);
            min-height: 100vh;
            background: radial-gradient(820px 480px at 6% -6%, rgba(167,139,250,.30), transparent 60%), radial-gradient(740px 480px at 98% 4%, rgba(34,211,238,.22), transparent 58%), radial-gradient(820px 540px at 50% 112%, rgba(251,191,36,.16), transparent 60%), linear-gradient(160deg, #f8f6ff 0%, #ffffff 50%, #eefbff 100%);
            background-attachment: fixed;
            overflow-x: hidden;
        }
        body::before { content: ""; position: fixed; inset: 0; z-index: -2; background: url('https://i.imgur.com/CQgjfNJ.png') center/cover no-repeat fixed; opacity: .08; pointer-events: none; }
        body::after { content: ""; position: fixed; inset: 0; z-index: -1; background: url('https://i.imgur.com/oyqM5oF.png') center/contain no-repeat fixed; opacity: .05; pointer-events: none; }
        ::selection { background: rgba(124,58,237,.22); }
        a { text-decoration: none; color: inherit; }
        button { font-family: 'Poppins', sans-serif; cursor: pointer; }
        input { font-family: 'Poppins', sans-serif; outline: none; }
        img { max-width: 100%; display: block; }
        .hidden { display: none !important; }
        .page-gate {
            position: fixed; inset: 0; z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            background: rgba(248,246,255,0.95);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        .page-gate.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .auth-card {
            background: rgba(255,255,255,.92);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,.7);
            border-radius: 26px;
            padding: 34px 28px;
            width: 100%; max-width: 420px; margin: 20px;
            text-align: center;
            box-shadow: 0 34px 80px rgba(80,40,160,.2);
        }
        .auth-card .logo { width: 80px; height: 80px; object-fit: contain; background: #fff; border-radius: 50%; padding: 8px; margin: 0 auto 12px; box-shadow: 0 12px 28px rgba(124,58,237,.28); }
        .auth-card h2 { font-size: 20px; font-weight: 900; margin-bottom: 4px; color: var(--ink); }
        .auth-card p { font-size: 12.5px; color: var(--muted); margin-bottom: 22px; }
        .auth-input {
            width: 100%;
            background: #fff;
            border: 1.5px solid var(--line);
            border-radius: 13px;
            padding: 14px 16px;
            color: var(--ink);
            font-size: 13px;
            outline: none;
            transition: all .2s ease;
            margin-bottom: 12px;
        }
        .auth-input:focus { border-color: var(--violet); box-shadow: 0 0 0 4px rgba(124,58,237,.1); }
        .input-wrap { position: relative; width: 100%; margin-bottom: 12px; }
        .input-wrap input { padding-right: 48px; margin-bottom: 0; }
        .input-wrap .toggle-pass {
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: var(--muted); font-size: 18px;
            cursor: pointer; padding: 6px; transition: color .2s;
        }
        .input-wrap .toggle-pass:hover { color: var(--violet); }
        .auth-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--violet), var(--violet-d));
            border: none;
            border-radius: 13px;
            padding: 14px;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 4px;
            transition: transform 0.15s, opacity 0.2s;
        }
        .auth-btn:active { transform: scale(0.97); }
        .auth-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .auth-btn.loading { opacity: 0.7; pointer-events: none; }
        .auth-error { font-size: 12.5px; color: var(--rose); text-align: center; margin-top: 10px; display: none; }
        .page-dash { display: none; }
        .page-dash.active { display: block; padding: 28px 18px 40px; max-width: 1000px; margin: 0 auto; position: relative; z-index: 1; }
        .dash-header {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(255,255,255,.9);
            backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255,255,255,.7);
            border-radius: 20px;
            padding: 18px; margin-bottom: 20px;
            box-shadow: var(--shadow);
            gap: 14px; flex-wrap: wrap;
        }
        .dash-header-left { display: flex; align-items: center; gap: 14px; }
        .dash-header-left .logo-sm { width: 46px; height: 46px; border-radius: 50%; background: #fff; padding: 6px; box-shadow: 0 8px 20px rgba(124,58,237,.25); }
        .dash-header-left h1 { font-size: 16px; font-weight: 900; color: var(--ink); }
        .dash-header-left h1 span { color: var(--violet-l); }
        .dash-header-left .greeting { font-size: 12px; color: var(--muted); margin-top: 2px; }
        .dash-header-right { display: flex; gap: 10px; align-items: center; }
        .dash-header-right button {
            border: none; background: rgba(244,63,94,.1); color: var(--rose);
            padding: 10px 18px; border-radius: 12px; cursor: pointer; font-size: 13px; font-weight: 700;
            display: flex; align-items: center; gap: 8px; transition: all .2s ease;
        }
        .dash-header-right button:hover { background: var(--rose); color: #fff; }
        .search-section {
            background: rgba(255,255,255,.9);
            backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255,255,255,.7);
            border-radius: 20px;
            padding: 24px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }
        .search-section .search-title { font-size: 16px; font-weight: 800; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
        .search-section .search-title i { color: var(--violet); }
        .search-row { display: flex; gap: 12px; flex-wrap: wrap; }
        .search-row input {
            flex: 1; min-width: 200px;
            background: #fff;
            border: 1.5px solid var(--line);
            border-radius: 13px;
            padding: 14px 16px;
            color: var(--ink);
            font-size: 13px;
            transition: all .2s ease;
        }
        .search-row input:focus { border-color: var(--violet); box-shadow: 0 0 0 4px rgba(124,58,237,.1); }
        .search-row button {
            background: linear-gradient(135deg, var(--violet), var(--violet-d));
            border: none; border-radius: 13px; padding: 14px 28px;
            color: #fff; font-size: 14px; font-weight: 700;
            display: flex; align-items: center; gap: 8px;
            transition: transform 0.15s, opacity 0.2s;
        }
        .search-row button:active { transform: scale(0.97); }
        .search-row button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .result-section { display: none; }
        .result-section.active { display: block; }
        .result-header {
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap; gap: 12px; margin-bottom: 16px;
        }
        .result-header .back-btn {
            background: rgba(124,58,237,.1); border: 1px solid var(--line);
            border-radius: 12px; padding: 10px 18px;
            color: var(--ink); font-size: 13px; font-weight: 600;
            display: flex; align-items: center; gap: 8px;
            transition: background .2s;
        }
        .result-header .back-btn:hover { background: rgba(124,58,237,.2); }
        .result-header .result-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .result-header .result-actions button {
            border-radius: 12px; padding: 10px 18px; font-size: 13px; font-weight: 600;
            display: flex; align-items: center; gap: 8px; border: none;
            transition: transform 0.15s;
        }
        .result-header .result-actions button:active { transform: scale(0.96); }
        .result-header .result-actions .pdf-gen { background: rgba(239,68,68,.1); color: var(--rose); }
        .result-header .result-actions .pdf-gen:hover { background: rgba(239,68,68,.2); }
        .result-header .result-actions .print-view { background: rgba(16,185,129,.1); color: var(--green); }
        .result-header .result-actions .print-view:hover { background: rgba(16,185,129,.2); }
        .data-card {
            background: rgba(255,255,255,.9);
            backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255,255,255,.7);
            border-radius: 18px; padding: 18px;
            box-shadow: var(--shadow); margin-bottom: 14px;
        }
        .data-card .card-title {
            font-size: 14px; font-weight: 800; margin-bottom: 12px;
            display: flex; align-items: center; gap: 8px; color: var(--ink);
        }
        .data-card .card-title i { color: var(--violet); }
        .data-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
        .data-item {}
        .data-item .di-label { font-size: 10px; color: var(--muted); text-transform: uppercase; font-weight: 700; letter-spacing: .5px; }
        .data-item .di-value { font-size: 13px; font-weight: 600; color: var(--ink); margin-top: 2px; word-break: break-word; }
        .data-item .di-value.na { color: var(--muted); font-weight: 400; }
        .status-badge {
            display: inline-block; padding: 4px 14px; border-radius: 20px;
            font-size: 11px; font-weight: 700; text-transform: uppercase;
        }
        .status-badge.active { background: rgba(16,185,129,.12); color: var(--green); }
        .status-badge.pending { background: rgba(245,158,11,.12); color: var(--amber); }
        .status-badge.locked { background: rgba(244,63,94,.12); color: var(--rose); }
        .loading-overlay {
            position: fixed; inset: 0; z-index: 10000;
            display: flex; align-items: center; justify-content: center;
            background: rgba(248,246,255,0.92);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            transition: opacity 0.4s;
        }
        .loading-overlay.hidden { opacity: 0; pointer-events: none; }
        .loader-box { text-align: center; }
        .loader-spin { width: 52px; height: 52px; border: 4px solid var(--line); border-top-color: var(--violet); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-box p { font-size: 14px; color: var(--muted); font-weight: 500; }
        .pdf-actions {
            display: flex; gap: 12px; flex-wrap: wrap; margin-top: 14px;
            justify-content: center;
        }
        .pdf-actions button {
            border-radius: 12px; padding: 12px 24px; font-size: 13px; font-weight: 700;
            display: flex; align-items: center; gap: 8px; border: none;
            transition: transform 0.15s;
        }
        .pdf-actions button:active { transform: scale(0.96); }
        .pdf-actions .print-pdf { background: rgba(16,185,129,.1); color: var(--green); }
        .pdf-actions .print-pdf:hover { background: rgba(16,185,129,.2); }
        .pdf-actions .upload-pdf { background: rgba(14,165,233,.1); color: var(--cyan); }
        .pdf-actions .upload-pdf:hover { background: rgba(14,165,233,.2); }
        .toast-container {
            position: fixed; top: 20px; right: 20px; z-index: 100000;
            display: flex; flex-direction: column; gap: 10px;
            max-width: min(92vw, 420px); pointer-events: none;
        }
        .toast {
            display: flex; align-items: flex-start; gap: 11px;
            background: rgba(255,255,255,.97); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--line); border-radius: 15px; padding: 14px 15px;
            box-shadow: 0 16px 38px rgba(30,27,75,.18);
            font-size: 13.5px; font-weight: 500; color: var(--ink);
            animation: toastIn .35s ease both;
            pointer-events: auto;
            max-width: 100%;
        }
        .toast.out { animation: toastOut .3s ease both; }
        @keyframes toastIn { from { opacity: 0; transform: translateX(44px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes toastOut { to { opacity: 0; transform: translateX(44px); } }
        .toast > i { font-size: 18px; margin-top: 2px; flex-shrink: 0; }
        .toast.success > i { color: var(--green); }
        .toast.error > i { color: var(--rose); }
        .toast.info > i { color: var(--violet); }
        .toast.warning > i { color: var(--amber); }
        .toast .toast-body { flex: 1; min-width: 0; }
        .toast .toast-body b { display: block; font-size: 13.5px; margin-bottom: 2px; }
        .toast .toast-body p { margin: 0; color: var(--muted); font-size: 12.5px; line-height: 1.5; }
        .toast .toast-close {
            border: none; background: rgba(239,68,68,.1); color: var(--rose);
            width: 28px; height: 28px; border-radius: 9px; cursor: pointer; font-size: 12px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; transition: all .2s ease;
        }
        .toast .toast-close:hover { background: var(--rose); color: #fff; }
        .toast-container:empty { display: none; }
        .no-result { text-align: center; padding: 40px 20px; color: var(--muted); }
        .no-result i { font-size: 48px; margin-bottom: 12px; color: var(--line); }
        .no-result p { font-size: 14px; }
        @media (max-width: 600px) {
            .dash-header { flex-direction: column; gap: 12px; }
            .dash-header-left h1 { font-size: 15px; }
            .search-row { flex-direction: column; }
            .search-row input { min-width: auto; }
            .search-row button { width: 100%; justify-content: center; }
            .result-header { flex-direction: column; align-items: stretch; }
            .data-grid { grid-template-columns: 1fr; }
            .auth-card { padding: 32px 24px; }
            .toast-container { top: 10px; right: 10px; max-width: calc(100vw - 20px); }
        }
        @media print {
            .page-gate, .search-section, .result-header, .dash-header-right, .pdf-actions, .toast-container, .loading-overlay { display: none !important; }
            .page-dash.active { padding: 0; }
            .dash-header { border: 1px solid #333; }
            .data-card { break-inside: avoid; }
            body { background: #fff !important; color: #000 !important; }
            .data-card, .dash-header, .search-section { background: #f8fafc !important; border-color: #ddd !important; box-shadow: none !important; }
            .data-item .di-value { color: #000 !important; }
        }
    </style>
</head>
<body>
<div class="page-gate" id="pageGate">
    <div class="auth-card">
        <img src="https://i.imgur.com/oyqM5oF.png" alt="IDT Academy" class="log">
        <h2>Admin Access</h2>
        <p>Sign in with your Supabase account to continue</p>
        <input type="email" class="auth-input" id="authEmail" placeholder="Email address" autocomplete="email">
        <div class="input-wrap">
            <input type="password" class="auth-input" id="authPass" placeholder="Password" autocomplete="current-password">
            <button class="toggle-pass" id="togglePass" type="button"><i class="fa-regular fa-eye-slash"></i></button>
        </div>
        <button class="auth-btn" id="authBtn"><i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In</button>
        <p class="auth-error" id="authError">Login failed. Please check your credentials.</p>
    </div>
</div>
<div class="loading-overlay hidden" id="loadingOverlay">
    <div class="loader-box">
        <div class="loader-spin"></div>
        <p id="loadingText">Processing...</p>
    </div>
</div>
<div class="page-dash" id="pageDash">
    <div class="dash-header">
        <div class="dash-header-left">
            <img src="https://i.imgur.com/oyqM5oF.png" alt="IDT Academy" class="logo-sm">
            <div>
                <h1>IDT <span>Academy</span> <span style="font-size:13px;font-weight:400;color:#64748b;">| Admin</span></h1>
                <div class="greeting" id="greetingText">Barka da zuwa Admin</div>
            </div>
        </div>
        <div class="dash-header-right">
            <button id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
        </div>
    </div>
    <div class="search-section" id="searchSection">
        <div class="search-title"><i class="fa-solid fa-magnifying-glass"></i> Search Student</div>
        <div class="search-row">
            <input type="text" id="searchInput" placeholder="Enter email or phone number..." autocomplete="off">
            <button id="searchBtn"><i class="fa-solid fa-search"></i> Search</button>
        </div>
    </div>
    <div class="result-section" id="resultSection">
        <div class="result-header">
            <button class="back-btn" id="backBtn"><i class="fa-solid fa-arrow-left"></i> Back to Search</button>
            <div class="result-actions">
                <button class="pdf-gen" id="pdfBtn"><i class="fa-solid fa-file-pdf"></i> Generate PDF</button>
            </div>
        </div>
        <div id="userDataContainer"></div>
        <div class="pdf-actions hidden" id="pdfActions">
            <button class="print-pdf" id="printPdfBtn"><i class="fa-solid fa-print"></i> Print</button>
            <button class="upload-pdf" id="uploadPdfBtn"><i class="fa-solid fa-cloud-arrow-up"></i> Upload</button>
        </div>
    </div>
</div>
<div class="toast-container" id="toastContainer"></div>
<script type="module" src="adminChek.js"></script>
</body>
</html>
